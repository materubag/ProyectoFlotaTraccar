# =============================================================================
# SonarQube — Configuración de Auditoría de Calidad y Seguridad de Código
# Sistema de Monitoreo y Evaluación de Rutas de Transporte Universitario
# Norma de Referencia: ISO/IEC 25010 (SQuaRE)
# =============================================================================

# Identificación del Proyecto
sonar.projectKey=fleet-rutas-transporte-universitario
sonar.projectName=Sistema de Monitoreo y Evaluacion de Rutas de Transporte Universitario
sonar.projectVersion=1.0.0

# Rutas de Fuentes a Auditar
sonar.sources=addons/fleet_rutas,addons/fleet_traccar,addons/fleet_reports
sonar.tests=addons/fleet_rutas/tests
sonar.sourceEncoding=UTF-8
sonar.language=py

# Configuración de Python
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Exclusiones de Auditoría
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**,addons/fleet_rutas/tests/**,addons/*/static/lib/**,**/dist/**,**/backups/**

# Inclusiones para Pruebas Unitarias
sonar.test.inclusions=addons/fleet_rutas/tests/test_*.py

# Umbrales del Quality Gate (Políticas de Calidad ISO 25010)
# 1. Cobertura mínima de pruebas unitarias: 80%
# 2. Deuda técnica máxima tolerada: <= 1 día hombre
# 3. Código duplicado máximo: <= 3%
# 4. Vulnerabilidades de seguridad críticas: 0 (OWASP / CWE)
# 5. Bugs críticos permitidos: 0
# 6. Complejidad ciclomática máxima por función: 15

# Proveedor de SCM
sonar.scm.provider=git

